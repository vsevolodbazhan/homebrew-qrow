name: update-casks

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-casks
  cancel-in-progress: true

jobs:
  update-casks:
    name: update-casks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: update-casks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_casks.py

      - name: commit-casks
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks; then
            echo "Casks are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks
          git commit -m "qrow: update casks"
          git push
